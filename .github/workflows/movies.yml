name: Movies

# Once a week: movies.py makes data/movies.json (IMDb's top 250 from IMDb's free datasets, with Arabic summaries
# from Wikipedia) for the page's «فيلم مقترح» card.
on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1'
  push:
    branches: [main]
    paths: ['movies.py', '.github/workflows/movies.yml']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  movies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -u movies.py
      - name: Save data/movies.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/movies.json
          git diff --cached --quiet && exit 0
          git commit -qm "Update movies"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
